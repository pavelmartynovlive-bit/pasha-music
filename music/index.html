<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Music" />
  <link rel="stylesheet" href="../styles.css" />
  <title>Music</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Личная PWA</div>
        <h1>Музыка</h1>
      </div>
      <button class="icon-button" aria-label="Профиль">●</button>
    </header>

    <section class="hero">
      <div class="cover">
        <span>♪</span>
      </div>

      <div class="track-meta">
        <div class="track-label">Сейчас ничего не играет</div>
        <div class="track-title">Твой плеер</div>
        <div class="track-artist">VK подключим следующим шагом</div>
      </div>

      <div class="progress"><div class="progress-fill"></div></div>

      <div class="controls">
        <button class="control">↶</button>
        <button class="play" id="playButton">▶</button>
        <button class="control">↷</button>
      </div>
    </section>

    <section class="section">
      <div class="section-title">
        <h2>Моя музыка</h2>
        <span>0 треков</span>
      </div>

      <div class="empty">
        <div class="empty-icon">♫</div>
        <div>
          <strong>Оболочка готова</strong>
          <p>Здесь появятся твои треки после подключения VK.</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js', { scope: '../' });
    }

    document.getElementById('playButton').addEventListener('click', () => {
      alert('Плеер установлен 🙂 Следующий шаг — подключить VK.');
    });
  </script>
</body>
</html>
