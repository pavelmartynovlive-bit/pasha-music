<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#041634" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Music" />
  <link rel="stylesheet" href="../styles.css?v=34" />
  <title>Pasha Music</title>
</head>
<body>
  <main class="app-shell" id="mainScreen">
    <header class="home-header">
      <nav class="compact-tabs" id="homeTabs" aria-label="Главные разделы">
        <button class="compact-tab active" type="button" data-home-tab="search" aria-label="Поиск" aria-selected="true">
          <span class="compact-tab-emoji" aria-hidden="true">🔍</span>
        </button>
        <button class="compact-tab" type="button" data-home-tab="library" aria-label="Моя музыка" aria-selected="false">
          <span class="compact-tab-emoji" aria-hidden="true">🩶</span>
        </button>
      </nav>
      <button class="icon-button" id="settingsButton" type="button" aria-label="Настройки подключения">⚙</button>
    </header>

    <section class="setup-panel" id="setupPanel" hidden>
      <div class="setup-heading">
        <div><div class="eyebrow">Подключение</div><h2>Музыкальный backend</h2></div>
        <button class="close-button" id="closeSetupButton" type="button" aria-label="Закрыть">×</button>
      </div>
      <form id="setupForm">
        <label>HTTPS-адрес backend
          <input id="backendUrlInput" type="url" inputmode="url" placeholder="https://music-api.example.com" autocomplete="url" required />
        </label>
        <label>Ключ доступа
          <input id="apiKeyInput" type="password" placeholder="Хранится только на этом устройстве" autocomplete="off" />
        </label>
        <button class="primary-button" type="submit">Сохранить и подключиться</button>
      </form>
      <p class="setup-note">VK cookies остаются только на сервере и никогда не сохраняются в PWA.</p>
    </section>

    <section class="home-view search-home-view" id="searchHomeView">
      <div class="mascot-hero" aria-hidden="true">
        <div class="cat-mascot" id="catMascot" data-state="idle">
          <img class="cat-mascot-image cat-mascot-idle" src="./assets/cat-idle.webp" alt="" decoding="async" />
          <img class="cat-mascot-image cat-mascot-playing" src="./assets/cat-playing.webp?v=2" alt="" decoding="async" />
          <svg class="cat-mascot-svg" data-state="idle" viewBox="0 0 360 360" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse class="shadow" cx="180" cy="315" rx="88" ry="18"/>
          <g id="catLayers">
            <g id="notes">
              <g transform="translate(78 96)"><circle class="note" cx="10" cy="24" r="8"/><rect class="note" x="16" y="2" width="6" height="24" rx="3"/><path class="note" d="M22 4C34 0 40 4 40 4V12C35 9 28 9 22 12V4Z"/></g>
              <g transform="translate(264 118) rotate(8)"><circle class="note" cx="10" cy="24" r="8"/><rect class="note" x="16" y="2" width="6" height="24" rx="3"/><path class="note" d="M22 4C34 0 40 4 40 4V12C35 9 28 9 22 12V4Z"/></g>
            </g>
            <g id="tail">
              <path class="dark-fur" d="M248 244C292 250 304 300 276 323C247 346 205 327 224 302C236 286 257 289 265 304C272 316 286 313 288 302C291 285 278 265 244 259Z"/>
              <path class="light-fur" d="M270 317C260 327 245 327 234 320C239 314 247 310 257 309C264 309 269 312 270 317Z"/>
            </g>
            <g id="body">
              <path class="light-fur" d="M120 156C120 123 145 103 180 103C215 103 240 123 240 156V246C240 282 214 307 180 307C146 307 120 282 120 246V156Z"/>
              <path class="dark-fur" d="M120 169C127 150 140 137 154 128V278C135 269 120 246 120 214V169Z"/>
              <path class="dark-fur" d="M240 177C233 157 220 142 206 133V287C226 279 240 255 240 223V177Z"/>
            </g>
            <g id="leftPaw"><ellipse class="light-fur" cx="153" cy="291" rx="23" ry="16"/></g>
            <g id="rightPaw"><ellipse class="light-fur" cx="207" cy="291" rx="23" ry="16"/></g>
            <g id="leftEar"><path class="dark-fur" d="M124 84C131 50 152 32 171 34C176 58 171 86 157 105Z"/><path class="ear-inner" d="M136 81C142 59 154 48 165 49C167 64 164 81 155 94Z"/></g>
            <g id="rightEar"><path class="dark-fur" d="M236 84C229 50 208 32 189 34C184 58 189 86 203 105Z"/><path class="ear-inner" d="M224 81C218 59 206 48 195 49C193 64 196 81 205 94Z"/></g>
            <g id="head">
              <circle class="light-fur" cx="180" cy="126" r="72"/>
              <path class="dark-fur" d="M109 111C111 77 136 56 170 54C164 92 144 120 118 137C113 130 110 121 109 111Z"/>
              <path class="dark-fur" d="M250 108C250 84 238 64 216 56C214 82 222 108 238 130C246 123 250 116 250 108Z"/>
              <g id="eyesOpen">
                <ellipse class="eye" cx="157" cy="130" rx="5" ry="8"/>
                <ellipse class="eye" cx="203" cy="130" rx="5" ry="8"/>
                <circle class="eye-glint" cx="155.5" cy="127.5" r="1.5"/>
                <circle class="eye-glint" cx="201.5" cy="127.5" r="1.5"/>
              </g>
              <g id="eyesClosed"><path class="cat-line" d="M144 128C152 136 161 136 169 128M191 128C199 136 208 136 216 128"/></g>
              <path class="nose" d="M180 143C174 143 171 138 175 134H185C189 138 186 143 180 143Z"/>
              <path class="cat-line" d="M180 143V150M180 150C175 156 169 158 162 158M180 150C185 156 191 158 198 158M142 150H108M145 159H114M218 150H252M215 159H246"/>
            </g>
            <g id="headphones">
              <path class="headphones-main" d="M126 108C133 75 154 56 180 56C206 56 227 75 234 108L224 110C219 82 202 68 180 68C158 68 141 82 136 110Z"/>
              <g transform="translate(118 117)"><rect class="headphones-main" width="34" height="48" rx="17"/><rect class="headphones-accent" x="5" y="5" width="24" height="38" rx="12"/><rect class="headphones-main" x="9" y="8" width="16" height="32" rx="8"/></g>
              <g transform="translate(208 117)"><rect class="headphones-main" width="34" height="48" rx="17"/><rect class="headphones-accent" x="5" y="5" width="24" height="38" rx="12"/><rect class="headphones-main" x="9" y="8" width="16" height="32" rx="8"/></g>
              <g transform="translate(124 176)"><ellipse class="headphones-main" cx="20" cy="20" rx="20" ry="24"/><ellipse class="headphones-accent" cx="20" cy="20" rx="15" ry="19"/><ellipse class="headphones-main" cx="20" cy="20" rx="10" ry="14"/></g>
              <g transform="translate(196 176)"><ellipse class="headphones-main" cx="20" cy="20" rx="20" ry="24"/><ellipse class="headphones-accent" cx="20" cy="20" rx="15" ry="19"/><ellipse class="headphones-main" cx="20" cy="20" rx="10" ry="14"/></g>
            </g>
          </g>
          </svg>
        </div>
      </div>

      <div class="search-area">
        <form class="search-form" id="searchForm" role="search">
          <button class="search-submit" type="submit" aria-label="Найти музыку">⌕</button>
          <input id="searchInput" type="search" inputmode="search" enterkeyhint="search" placeholder="Трек или исполнитель" autocomplete="off" aria-label="Поиск музыки" aria-controls="searchSuggestions searchResults" />
          <button class="search-clear" id="clearSearchButton" type="button" aria-label="Очистить поиск" hidden>×</button>
        </form>

        <div class="search-suggestions" id="searchSuggestions" aria-label="Поисковые подсказки" hidden></div>

        <section class="search-results" id="searchResults" aria-live="polite" hidden>
          <section class="result-group" id="searchTrackGroup">
            <div class="search-result-list" id="searchResultList"></div>
          </section>
          <section class="result-group" id="searchAlbumGroup">
            <h3>Альбомы</h3>
            <div class="album-grid search-album-grid" id="searchAlbumList"></div>
          </section>
        </section>
      </div>
    </section>

    <div class="status" id="status" role="status">Подготовка…</div>

    <section class="home-view library-home-view" id="libraryHomeView" hidden>
      <section class="personal-library">
        <div class="section-title"><h2>Моя музыка</h2><span id="personalLibraryCount"></span></div>
        <nav class="library-switcher" id="librarySwitcher" aria-label="Моя музыка">
          <button class="library-switch active" type="button" data-library-view="albums">Альбомы</button>
          <button class="library-switch" type="button" data-library-view="playlists">Плейлисты</button>
        </nav>
        <div class="album-grid" id="libraryAlbumList"></div>
        <div class="playlist-grid" id="libraryPlaylistList" hidden></div>
      </section>

      <section class="library">
        <div class="section-title"><h2 id="sectionTitle">Треки</h2><span id="trackCount">0 треков</span></div>
        <nav class="section-tabs" id="sectionTabs" aria-label="Музыкальные разделы"></nav>
        <div class="track-list" id="trackList"></div>
      </section>
    </section>
  </main>

  <main class="detail-screen" id="collectionScreen" hidden>
    <header class="detail-topbar">
      <button class="back-button" id="collectionBackButton" type="button" aria-label="Назад">‹</button>
      <span id="collectionKind">Альбом</span>
      <span class="detail-spacer"></span>
    </header>
    <div class="collection-hero">
      <div class="collection-cover" id="collectionCover"></div>
      <div class="collection-copy">
        <div class="collection-kicker" id="collectionKicker"></div>
        <h1 id="collectionTitle"></h1>
        <button class="artist-link" id="collectionArtist" type="button"></button>
        <p id="collectionMeta"></p>
      </div>
    </div>
    <div class="collection-actions">
      <button class="primary-action" id="collectionPlayButton" type="button">▶ Play</button>
      <button class="secondary-action" id="collectionShuffleButton" type="button">Shuffle</button>
      <button class="secondary-action" id="collectionMixButton" type="button">Создать микс</button>
    </div>
    <div class="track-list collection-track-list" id="collectionTrackList"></div>
  </main>

  <section class="mini-player" id="miniPlayer" aria-label="Сейчас играет" hidden>
    <button class="mini-player-open" id="openPlayerButton" type="button" aria-label="Открыть полноэкранный плеер">
      <span class="mini-art" id="miniArt"><img id="miniCoverImage" alt="" hidden /><span id="miniCoverFallback">♪</span></span>
      <span class="mini-copy"><strong id="miniTrackTitle">Трек</strong><small id="miniTrackArtist">Исполнитель</small></span>
    </button>
    <button class="mini-control mini-mix" id="miniMixButton" type="button" aria-label="Создать микс по треку">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l9-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="15" cy="16" r="3"/><path d="M4 5h4M6 3v4"/></svg>
    </button>
    <button class="mini-control" id="miniPlayButton" type="button" aria-label="Пауза">❚❚</button>
    <button class="mini-control mini-next" id="miniNextButton" type="button" aria-label="Следующий трек">›</button>
    <span class="mini-progress" aria-hidden="true"><span id="miniProgress"></span></span>
  </section>

  <section class="full-player" id="fullPlayer" aria-label="Полноэкранный плеер" hidden>
    <div class="player-backdrop" id="playerBackdrop"></div>
    <div class="full-player-content">
      <header class="player-header">
        <button class="player-close" id="closePlayerButton" type="button" aria-label="Вернуться к музыке">⌄</button>
        <span>Сейчас играет</span>
        <span class="player-header-spacer"></span>
      </header>

      <div class="cover" id="cover">
        <img id="coverImage" alt="" hidden />
        <span id="coverFallback">♪</span>
      </div>
      <div class="track-meta">
        <div class="track-label" id="trackLabel">Сейчас играет</div>
        <div class="track-title" id="trackTitle">Pasha Music</div>
        <div class="track-artist" id="trackArtist">Выберите трек</div>
      </div>
      <button class="player-mix-button" id="playerMixButton" type="button">Создать микс по треку</button>
      <input class="seek" id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Позиция воспроизведения" />
      <div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
      <div class="controls">
        <button class="control" id="previousButton" type="button" aria-label="Предыдущий трек">‹</button>
        <button class="play" id="playButton" type="button" aria-label="Воспроизвести">▶</button>
        <button class="control" id="nextButton" type="button" aria-label="Следующий трек">›</button>
      </div>
    </div>
  </section>

  <section class="action-sheet" id="trackActionSheet" hidden aria-modal="true" role="dialog" aria-label="Действия с треком">
    <button class="action-sheet-backdrop" id="actionSheetBackdrop" type="button" aria-label="Закрыть"></button>
    <div class="action-sheet-panel">
      <div class="action-sheet-track"><strong id="actionSheetTitle"></strong><small id="actionSheetArtist"></small></div>
      <button id="actionSheetMixButton" type="button">Создать микс по треку</button>
      <button id="actionSheetCloseButton" type="button">Отмена</button>
    </div>
  </section>
  <audio id="audio" preload="metadata" playsinline></audio>
  <script type="module" src="./app.js?v=34"></script>
</body>
</html>
